<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Raihan Khan">
  <title>Raihan Khan</title>
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0a0a0f; }
      .fg { fill: #ffffff; }
      .accent { fill: #38bdf8; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #ffffff; }
      .fg { fill: #0a0a0f; }
      .accent { fill: #0a0a0f; }
    }
  </style>

  <!-- Rounded square background -->
  <rect class="bg" width="180" height="180" rx="37" />

  <!-- "RK" monogram, centered in 180x180 viewBox -->
  <!-- Letter R: x=30..78, y=52..128 -->
  <!-- Letter K: x=92..150, y=52..128 -->
  <g class="fg" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="100" text-anchor="middle">
    <text x="60" y="124" letter-spacing="-4">R</text>
    <text x="118" y="124" letter-spacing="-4">K</text>
  </g>

  <!-- Subtle accent dot underlining the brand mark -->
  <circle class="accent" cx="90" cy="146" r="4" />
</svg>
