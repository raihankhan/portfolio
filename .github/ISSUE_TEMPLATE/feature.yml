name: Feature Request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "status: needs-review"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this for features that affect the portfolio site itself.
        For larger ideas / RFCs, please use **GitHub Discussions → RFCs & Ideas** instead.

  - type: input
    id: title
    attributes:
      label: One-line title
      description: What do you want?
      placeholder: e.g., "Add dark/light theme toggle to header"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who has this problem?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you solve this?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why is this one better?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where in the codebase?
      options:
        - Frontend (UI / components)
        - Backend / API
        - Platform / DevOps
        - AI / agent
        - Content
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: Estimated effort
      options:
        - XS (less than 1 hour)
        - S (1-3 hours)
        - M (3-8 hours)
        - L (1-3 days)
        - XL (3+ days)
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, links, etc.
    validations:
      required: false
